name: Verify MigrateProof

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Start and verify the disposable PostgreSQL service
        run: |
          docker pull postgres:17-bookworm@sha256:837bed18782820fe967067cb5328b02b0d9992c1be9a37ee0c9c492cfc03af3b
          npm run lab -- init
      - name: TypeScript validation
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: PostgreSQL integration tests
        run: npm run test:integration
      - name: Execute and preserve all six scenarios
        run: npm run lab -- verify
      - name: Build the dashboard
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Dashboard browser tests
        run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: migrateproof-evidence
          path: |
            runs/*.json
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
